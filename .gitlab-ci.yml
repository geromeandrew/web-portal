default:
    tags:
        - $PE_RUNNER_TAG
        
include:
    - project: globetelecom/common-toolchains/pipeline-coe/pipeline-modules
      ref: main
      file:
       - Application.gitlab-ci.yml

stages:
    - test
    - build_image
    - scan_image
    - publish_image


build_image:
  stage: build_image
  extends: .docker-build:kaniko-updated-vars
  # Define the dynamic variables using rules
  rules:
    # 1. Match Production tags (e.g., v1.0.0, v2.1)
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+/'
      variables:
        TARGET_OKTA_CLIENT_ID: $PRD_OKTA_CLIENT_ID
        TARGET_OKTA_ISSUER: $PRD_OKTA_ISSUER
        
    # 2. Match Development/Staging tags (e.g., dev-v1.0.0, staging)
    - if: '$CI_COMMIT_TAG =~ /^dev-/'
      variables:
        TARGET_OKTA_CLIENT_ID: $DEV_OKTA_CLIENT_ID
        TARGET_OKTA_ISSUER: $DEV_OKTA_ISSUER

    # 2. Match Development/Staging tags (e.g., dev-v1.0.0, staging)
    - if: '$CI_COMMIT_TAG =~ /^stg-/'
      variables:
        TARGET_OKTA_CLIENT_ID: $STG_OKTA_CLIENT_ID
        TARGET_OKTA_ISSUER: $STG_OKTA_ISSUER

  # Pass the resolved variables to Kaniko
  variables:
    BUILD_ARGS: "--build-arg VITE_OKTA_CLIENT_ID=$TARGET_OKTA_CLIENT_ID --build-arg VITE_OKTA_ISSUER=$TARGET_OKTA_ISSUER"
  artifacts:
    paths:
      - "*.tar"

scan_image:
    stage: scan_image
    extends: .app-scan:prisma-image-pe
    only:
        - tags
    needs:
        - build_image

publish_image:
    stage: publish_image
    extends: .docker-publish:jfrog
    script:
        - crane auth login -u ${JFROG_USERNAME} -p ${JFROG_PASSWORD} ${PE_JFROG_URL}
        - mv app_image.tar ${CI_PROJECT_NAME}.tar
        - crane push ${CI_PROJECT_DIR}/${CI_PROJECT_NAME}.tar "${PE_JFROG_URL}/${PE_JFROG_REPOSITORY}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}"
    only:
        - tags
