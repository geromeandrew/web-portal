name: web-portal-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile-local
    image: web-portal:local
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: ["pnpm", "exec", "vite", "--mode", "development", "--host", "0.0.0.0"]

volumes:
  web_node_modules:
