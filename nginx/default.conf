# This file is included at http scope via conf.d/default.conf.
map $http_user_agent $audit_browser {
  default "other";
  ~*Edg/ "Edge";
  ~*Chrome/ "Chrome";
  ~*Firefox/ "Firefox";
  ~*Safari/ "Safari";
}
map $http_referer $audit_referrer {
  default "";
  ~^(https?://[a-zA-Z0-9.-]+(?::[0-9]+)?)/ $1;
}
map $uri $audit_resource {
  default "/[unmatched]";
  /healthz "/healthz";
  /index.html "/index.html";
  /favicon.svg "/favicon.svg";
  /globe-logo-small.png "/globe-logo-small.png";
  "~^/assets/[A-Za-z0-9_.-]{1,180}$" $uri;
  ~^/login(?:/|$) "/login/[page]";
  ~^/prepaid(?:/|$) "/prepaid/[page]";
  ~^/memo(?:/|$) "/memo/[page]";
  ~^/processing-pipelines(?:/|$) "/processing-pipelines/[page]";
}
log_format portal_json escape=json '{"timestamp":"$time_iso8601","event":"web.access","requestId":"$request_id","sourceIp":"$remote_addr","method":"$request_method","resource":"$audit_resource","port":"$server_port","status":$status,"durationSeconds":$request_time,"userAgent":"$audit_browser","referrer":"$audit_referrer"}';
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/security-headers.conf;
  access_log /dev/stdout portal_json;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 201m;

  error_page 403 /security-errors/denied.html;
  error_page 404 /security-errors/missing.html;
  error_page 405 /security-errors/method.html;
  error_page 500 502 503 504 /security-errors/unavailable.html;
  location ^~ /security-errors/ { internal; }
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Prepaid permits a 100 MiB source plus bounded multipart overhead.
  # Keep the existing 5m ceiling for every other API module.
  location ^~ /api/workflows/prepaid/ {
    client_max_body_size 101m;
    proxy_request_buffering off;
    set $api_upstream http://web-portal-api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location ^~ /api/ {
    set $api_upstream http://web-portal-api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location ~* \.(?:css|js|mjs|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
