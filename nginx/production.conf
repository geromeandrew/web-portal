# This file is included at http scope via conf.d/default.conf.
map $http_user_agent $audit_browser {
  default "other";
  ~*Edg/ "Edge";
  ~*Chrome/ "Chrome";
  ~*Firefox/ "Firefox";
  ~*Safari/ "Safari";
}
map $http_referer $audit_referrer {
  default "";
  ~^(https?://[a-zA-Z0-9.-]+(?::[0-9]+)?)/ $1;
}
map $uri $audit_resource {
  default "/[unmatched]";
  /healthz "/healthz";
  /index.html "/index.html";
  /favicon.svg "/favicon.svg";
  /globe-logo-small.png "/globe-logo-small.png";
  "~^/assets/[A-Za-z0-9_.-]{1,180}$" $uri;
  ~^/login(?:/|$) "/login/[page]";
  ~^/prepaid(?:/|$) "/prepaid/[page]";
  ~^/memo(?:/|$) "/memo/[page]";
  ~^/processing-pipelines(?:/|$) "/processing-pipelines/[page]";
}
log_format portal_json escape=json '{"timestamp":"$time_iso8601","event":"web.access","requestId":"$request_id","sourceIp":"$remote_addr","method":"$request_method","resource":"$audit_resource","port":"$server_port","status":$status,"durationSeconds":$request_time,"userAgent":"$audit_browser","referrer":"$audit_referrer"}';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;
  access_log /dev/stdout portal_json;
  # Nginx native error logs may include URLs; protect/restrict the collector.
  error_log /dev/stderr warn;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  error_page 403 /security-errors/denied.html;
  error_page 404 /security-errors/missing.html;
  error_page 405 /security-errors/method.html;
  error_page 500 502 503 504 /security-errors/unavailable.html;
  location ^~ /security-errors/ { internal; }
  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location ~* \.(?:css|js|mjs|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
